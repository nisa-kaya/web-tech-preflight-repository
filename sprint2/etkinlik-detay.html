<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Detayı</title>
    <link rel="stylesheet" href="2416501086.css">
</head>
<body>
    <header>
      <h1>Kampüs Etkinlikleri</h1>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
        <a href="etkinlik-guncelle.html">Güncelle</a>
      </nav>
    </header>

    <main>
        <h2>Kariyer Günleri 2026</h2>
        
        <!-- Ana yan yana yerleşim alanı -->
        <div class="detay-container">
            <!-- Sol Taraf: Afiş ve Alt Yazısı -->
            <div class="detay-sol">
                <img src="afis.jpg" alt="etkinlik afişi">
                <p class="afis-yazi">Şekil 1: etkinlik afişi</p>
            </div>
            
            <!-- Sağ Taraf: Beyaz kutu (künye) ve dışındaki yazılar -->
            <div class="detay-sag">
                <!-- Sadece künyeyi içeren beyaz kutu -->
                <dl class="kunye-kutusu">
                    <dt>Tarih</dt>
                    <dd>12 Ekim, 14:00</dd>
                    
                    <dt>Yer</dt>
                    <dd>A Blok Salon</dd>
                    
                    <dt>Kategori</dt>
                    <dd>Seminer</dd>
                    
                    <dt>Kontenjan</dt>
                    <dd>120</dd>
                </dl>

                <!-- Beyaz kutunun DIŞINDA kalan açıklama ve buton -->
                <p class="etkinlik-aciklama">Mezunlarla kariyer söyleşileri ve şirket stantları.</p>
                
                <p>
                    <a href="etkinlikler.html" >← Listeye dön</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
