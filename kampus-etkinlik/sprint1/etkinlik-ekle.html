<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> | 
            <a href="etkinlik-ekle.html">Ekle</a> | 
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="POST">
            <div>
                <label for="etkinlik-adi">Etkinlik Adı</label><br>
                <input type="text" id="etkinlik-adi" name="etkinlik_adi" required>
            </div>

            <div>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                  
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konferans">Konferans</option>
                </select>
            </div>

            <div>
                <label for="tarih">Tarih</label><br>
                <input type="text" id="tarih" name="tarih" placeholder="gg.aa.yyyy" required>
            </div>

            <div>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
            </div>

            <div>
                <button type="submit">Kaydet</button>
            </div>
        </form>
    </main>
</body>
</html>
