<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="2416501086.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
      <h1>Etkinlik Ekle</h1>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      </nav>
    </header>

    <main>
 
        <form id="etkinlik-formu" novalidate>
            <div class="form-grup">
                <label for="ad">Etkinlik adı</label>
               
                <input type="text" id="ad" name="ad">
               
                <span id="ad-hata" class="hata-metni"></span>
            </div>
            
            <div class="form-grup">
                <label for="kategori">Kategori</label>
            
                <select id="kategori" name="kategori">
                    <option value="" disabled selected>Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
                <span id="kategori-hata" class="hata-metni"></span>
            </div>
            
            <div class="form-grup">
                <label for="tarih">Tarih</label>
           
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-metni"></span>
            </div>
            
            <div class="form-grup">
                <label for="aciklama">Açıklama</label>
                <!-- name="aciklama" eklendi -->
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                <span id="aciklama-hata" class="hata-metni"></span>
            </div>
            
              <div class="form-grup">
                <label for="saat">Saat</label>
           
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-metni"></span>
            </div>

              <div class="form-grup">
                <label for="yer">Yer</label>
           
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-metni"></span>
            </div>
            <button type="submit" class="btn">Kaydet</button>
        </form>

        
        <div id="form-mesaj"></div>
    </main>
</body>
</html>
