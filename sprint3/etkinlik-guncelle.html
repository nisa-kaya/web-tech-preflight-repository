<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="2416501086.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
      <h1>Etkinlik Güncelle</h1>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      
      </nav>
    </header>

    <main>
        <h2>Etkinlik Güncelle</h2>
        
        <form>
            <div class="form-grup">
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" value="Kariyer Günleri 2026" required>
            </div>
            
            <div class="form-grup">
                <label for="kategori">Kategori</label>
                <select id="kategori" required>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>
            
            <div class="form-grup">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" value="2026-10-12" required>
            </div>
            
            <div class="form-grup">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" rows="4">Mezun söyleşileri</textarea>
            </div>
            
            <button type="submit" class="btn">Güncelle</button>
        </form>
    </main>
</body>
</html>
